<style>
/* Brutalist, reading-first study app. Full-width shell: category rail | content (takes all free space) | page outline.
   Native CSS only. Shape rule: everything is sharp (radius 0). Borders are drawn in the text color.
   Color comes from a five-color palette with fixed roles (see "Color roles" below): each study mode and each
   category owns a color, learning states map to green / yellow / red. Body text always stays near-black on light. */
:root {
  --bg: #f4f4f3;
  --surface: #fdfdfc;
  --surface-2: #e8e8e6;
  --ink: #0e0e0e;
  --ink-soft: #151515;
  --muted: #424242;
  --line-soft: #bdbdbb;
  /* Palette (coolors.co/ff595e-ffca3a-8ac926-1982c4-6a4c93). Three tiers per color:
     --c-* base fill (blocks, tabs, badges), --d-* deep tone for text/icons on the page background,
     --t-* tint for large backgrounds behind body text. Text on fills: --on-fill (dark), --on-purple (light). */
  --c-red: #ff595e;
  --c-yellow: #ffca3a;
  --c-green: #8ac926;
  --c-blue: #1982c4;
  --c-purple: #6a4c93;
  --on-fill: #0e0e0e;
  --on-purple: #fdfdfc;
  --d-red: #c0262c;
  --d-yellow: #7a5600;
  --d-green: #3d690a;
  --d-blue: #0f5f94;
  --d-purple: #6a4c93;
  --t-red: color-mix(in srgb, var(--c-red) 20%, var(--surface));
  --t-yellow: color-mix(in srgb, var(--c-yellow) 26%, var(--surface));
  --t-green: color-mix(in srgb, var(--c-green) 22%, var(--surface));
  --t-blue: color-mix(in srgb, var(--c-blue) 16%, var(--surface));
  --t-purple: color-mix(in srgb, var(--c-purple) 16%, var(--surface));
  /* Roles mapped onto the palette */
  --accent: var(--d-blue);
  --accent-hover: #0a4670;
  --accent-soft: var(--t-blue);
  --accent-ink: #fdfdfc;
  --good: var(--d-green);
  --good-soft: var(--t-green);
  --bad: var(--d-red);
  --bad-soft: var(--t-red);
  --review: var(--d-yellow);
  --review-soft: var(--t-yellow);
  --mark: var(--c-yellow);
  --hue-scripting: var(--c-yellow);
  --hue-rendering: var(--c-purple);
  --hue-painting: var(--c-green);
  --hue-loading: var(--c-blue);
  --hue-system: var(--c-red);
  --hue-idle: var(--c-red);
  --mode: var(--c-blue);
  --code-bg: #f0f0ee;
  --code-inline: #e3e3e1;
  --tok-comment: #575757;
  --tok-keyword: #6a24d4;
  --tok-string: #0c6533;
  --tok-number: #923a00;
  --tok-func: #1c3cd0;
  --tok-tag: #a8160e;
  --tok-attr: #774600;
  --font-display: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --b: 2px solid var(--ink);          /* structural border */
  --b-thin: 1px solid var(--ink);     /* row dividers */
  --shadow: 5px 5px 0 var(--ink);     /* hard offset shadow, no blur */
  --measure: 92ch;                    /* max line length for running text only; code, tables and Q&A use the full column */
  --gutter: clamp(20px, 3.2vw, 64px);
  --bar-h: 64px;
  --rail-w: 272px;                    /* brand cell and rail share one column edge */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101010; --surface: #171717; --surface-2: #242424; --ink: #f1f1ef; --ink-soft: #e4e4e2; --muted: #b9b9b7; --line-soft: #3d3d3d;
    --d-red: #ff7d81; --d-yellow: #ffca3a; --d-green: #a6dc4f; --d-blue: #5bb3ec; --d-purple: #b9a2de;
    --accent-hover: #8fcbf3; --accent-ink: #101010;
    --code-bg: #0b0b0b; --code-inline: #2a2a2a; --tok-comment: #8f8f8f; --tok-keyword: #c9a6ff; --tok-string: #82dba5;
    --tok-number: #f3b56b; --tok-func: #93a6ff; --tok-tag: #ff9b91; --tok-attr: #f2c94c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101010; --surface: #171717; --surface-2: #242424; --ink: #f1f1ef; --ink-soft: #e4e4e2; --muted: #b9b9b7; --line-soft: #3d3d3d;
  --d-red: #ff7d81; --d-yellow: #ffca3a; --d-green: #a6dc4f; --d-blue: #5bb3ec; --d-purple: #b9a2de;
  --accent-hover: #8fcbf3; --accent-ink: #101010;
  --code-bg: #0b0b0b; --code-inline: #2a2a2a; --tok-comment: #8f8f8f; --tok-keyword: #c9a6ff; --tok-string: #82dba5;
  --tok-number: #f3b56b; --tok-func: #93a6ff; --tok-tag: #ff9b91; --tok-attr: #f2c94c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.6; margin: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a { color: var(--accent); text-underline-offset: 0.2em; text-decoration-thickness: 2px; }
a:hover { color: var(--accent-hover); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* No ligatures in code: "=>" must read as typed, not as an arrow glyph */
code, pre, kbd { font-family: var(--font-mono); font-variant-ligatures: none; }
h1, h2, h3 { font-family: var(--font-display); font-variant-ligatures: none; text-wrap: balance; line-height: 1.15; letter-spacing: -0.03em; word-spacing: -0.18em; color: var(--ink); font-weight: 800; }
p, li { text-wrap: pretty; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.15em; }
.muted { color: var(--muted); }
kbd { font-size: 0.74em; border: var(--b-thin); padding: 0 5px; background: var(--surface); color: var(--ink); }
.swatch { width: 10px; height: 10px; flex: none; display: inline-block; outline: 1px solid var(--ink); outline-offset: -1px; }
.ui-label { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

/* ---------- Top bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: var(--b); }
.bar-inner { padding-right: var(--gutter); height: var(--bar-h); display: flex; align-items: center; }
.brand { width: var(--rail-w); height: 100%; display: flex; align-items: center; padding-left: 20px; border-right: var(--b); text-decoration: none; color: var(--ink); flex: none; font-family: var(--font-mono); font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
.brand:hover { color: var(--accent); }
.tabs { display: flex; flex: none; height: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; border-right: var(--b); background: transparent; padding: 0 16px; cursor: pointer; height: 100%;
  font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--ink); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px;
}
.tab:hover { background: var(--surface-2); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tab .count { font-weight: 400; opacity: 0.75; }
.bar-tools { display: flex; gap: 10px; align-items: center; margin-left: auto; padding-left: 20px; flex: 0 1 380px; min-width: 0; }
.search { position: relative; flex: 1; min-width: 0; }
.search input {
  width: 100%; height: 40px; padding: 0 36px 0 38px; border: var(--b); border-radius: 0;
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.95rem;
}
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input:focus { outline: none; box-shadow: 3px 3px 0 var(--accent); }
.search .ic { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--ink); width: 17px; height: 17px; pointer-events: none; }
.search input:not(:placeholder-shown) + kbd { display: none; }
.search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; }
.icon-btn { border: var(--b); background: var(--surface); width: 40px; height: 40px; flex: none; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--ink); color: var(--bg); }
.icon-btn .ic { width: 19px; height: 19px; }

/* ---------- Shell: full width, the content column takes everything the rail leaves ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100dvh - var(--bar-h)); }
.rail {
  position: sticky; top: var(--bar-h); align-self: start; height: calc(100dvh - var(--bar-h)); overflow-y: auto;
  border-right: var(--b); background: var(--surface); padding: 28px 0 32px; display: grid; align-content: start; gap: 28px; scrollbar-width: thin;
}
.rail > * { min-width: 0; }
.rail-label { margin: 0 0 10px; padding: 0 20px; display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.rail-label .unit { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }
.rail ul { list-style: none; margin: 0; padding: 0; border-top: var(--b-thin); }
.rail li { border-bottom: var(--b-thin); }
.cat-link {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 20px; border: 0;
  background: transparent; cursor: pointer; text-align: left; color: var(--ink); font-size: 0.95rem; line-height: 1.35;
}
.cat-link:hover { background: var(--surface-2); }
.cat-link[aria-current="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.cat-link[aria-current="true"] .swatch { outline-color: var(--bg); }
.cat-link .n { margin-left: auto; font-family: var(--font-mono); font-size: 0.78rem; color: inherit; opacity: 0.8; font-variant-numeric: tabular-nums; }
.level-block { padding: 0 20px; }
.level-block .rail-label { padding: 0; }
.seg { display: flex; border: var(--b); background: var(--surface); }
.seg button { flex: 1; border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; cursor: pointer; color: var(--ink); white-space: nowrap; }
.seg button + button { border-left: var(--b); }
.seg button:hover { background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { min-width: 0; padding: 40px var(--gutter) 120px; }
.crumbs { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 18px; }
.crumbs a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; }
.crumbs a:hover { color: var(--accent); }
.view-head { margin-bottom: 36px; padding-bottom: 28px; border-bottom: var(--b); }
.view-head h1 { font-size: clamp(2rem, 1.3rem + 2.2vw, 3.4rem); margin: 0; }
.lede { color: var(--muted); max-width: var(--measure); margin: 14px 0 0; font-size: 1.1rem; line-height: 1.6; }
.head-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 24px; }
h2.sec { font-size: 1.15rem; margin: 0 0 18px; text-transform: uppercase; letter-spacing: 0; }

/* Buttons: hard edges, pressed state moves into its shadow */
.btn {
  border: var(--b); background: var(--surface); padding: 0 16px; min-height: 42px; border-radius: 0;
  cursor: pointer; font-family: var(--font-mono); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em;
  text-decoration: none; color: var(--ink); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
}
.btn:hover { background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 3px 3px 0 var(--ink); }
.btn.primary:hover { background: var(--accent-hover); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { border-color: var(--ink); background: var(--surface); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn kbd { margin-left: 2px; }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; }

/* Learning status markers (real state: unread, read, to review, known) */
.st { display: inline-grid; place-items: center; flex: none; }
.st .ic { width: 21px; height: 21px; }
.st-new { color: var(--line-soft); }
.st-read { color: var(--muted); }
.st-review { color: var(--review); }
.st-known { color: var(--good); }
.status-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border: 2px solid currentColor; }
.status-tag .ic { width: 15px; height: 15px; }
.status-tag.st-review { background: var(--review-soft); }
.status-tag.st-known { background: var(--good-soft); }
.level { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--ink); border: var(--b-thin); padding: 1px 7px; white-space: nowrap; }
.pill { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
mark { background: var(--mark); color: inherit; padding: 0 2px; }

/* ---------- Home ---------- */
.home-intro { margin-bottom: 44px; padding-bottom: 36px; border-bottom: var(--b); }
.home-intro h1 { font-size: clamp(2.4rem, 1.4rem + 3.4vw, 4.6rem); margin: 0; letter-spacing: -0.045em; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; margin-bottom: 56px; align-items: start; }
.box { background: var(--surface); border: var(--b); padding: 26px 28px; }
.progress-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 20px; border: var(--b); }
.progress-nums > div { padding: 14px 16px; }
.progress-nums > div + div { border-left: var(--b); }
.progress-nums b { display: block; font-family: var(--font-mono); font-size: 2.2rem; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.progress-nums b small { font-size: 1rem; color: var(--muted); font-weight: 700; letter-spacing: 0; }
.progress-nums span { font-size: 0.92rem; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.progress-nums .ic { width: 16px; height: 16px; }
.pn-known .ic { color: var(--good); }
.pn-review .ic { color: var(--review); }
.progress { height: 14px; background: var(--surface); border: var(--b); }
.progress span { display: block; height: 100%; background: var(--accent); transition: width 0.3s var(--ease); }
.last-read { margin: 16px 0 0; font-size: 0.98rem; color: var(--ink); }
.review-list { list-style: none; margin: 14px 0 0; padding: 0; border-top: var(--b); }
.review-list li { border-bottom: var(--b-thin); }
.review-list a { display: flex; align-items: center; gap: 12px; padding: 12px 4px; text-decoration: none; color: var(--ink); font-weight: 600; }
.review-list a:hover { background: var(--surface-2); }
.review-list .cat-short { margin-left: auto; font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
.review-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 28px; }
.review-head h3 { font-size: 1rem; margin: 0; text-transform: uppercase; }
.review-head a { font-size: 0.92rem; }
.empty-note { margin: 12px 0 0; font-size: 0.98rem; color: var(--muted); line-height: 1.55; }
.modes { list-style: none; margin: 0; padding: 0; border-top: var(--b); }
.modes li { border-bottom: var(--b-thin); }
.modes a { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 14px 4px; text-decoration: none; color: var(--ink); }
.modes a:hover { background: var(--surface-2); }
.modes a:hover b { text-decoration: underline; }
.modes .ic { width: 24px; height: 24px; color: var(--ink); grid-row: span 2; margin-top: 1px; }
.modes b { font-family: var(--font-mono); font-weight: 800; text-transform: uppercase; font-size: 0.92rem; letter-spacing: 0.02em; }
.modes small { grid-column: 2; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
.modes .pill { grid-row: 1; grid-column: 3; color: var(--ink); }
.cat-index { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); border-top: var(--b); border-left: var(--b); }
.cat-item { display: grid; align-content: start; gap: 6px; padding: 20px 22px 22px; border-right: var(--b); border-bottom: var(--b); text-decoration: none; color: var(--ink); background: var(--surface); }
.cat-item:hover { background: var(--ink); color: var(--bg); }
.cat-item:hover p, .cat-item:hover .meta, .cat-item:hover .meta b, .cat-item:hover h3 { color: var(--bg); }
.cat-item h3 { font-size: 1.05rem; margin: 0; display: flex; align-items: center; gap: 10px; }
.cat-item p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cat-item .meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
.cat-item .meta b { color: var(--ink); font-weight: 700; }

/* ---------- Topic list ---------- */
.tlist { border-top: var(--b); }
.trow {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 16px; align-items: start;
  padding: 18px 12px; border-bottom: var(--b-thin); text-decoration: none; color: var(--ink);
}
.trow:hover { background: var(--surface); }
.trow:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
.trow .st { grid-row: span 2; padding-top: 1px; }
.trow h3 { font-size: 1.1rem; margin: 0; }
.trow p { grid-column: 2 / -1; margin: 0; color: var(--muted); font-size: 0.98rem; line-height: 1.55; max-width: var(--measure); }
.trow .meta { display: flex; gap: 12px; align-items: center; }
.cat-progress { font-family: var(--font-mono); font-size: 0.82rem; text-transform: uppercase; color: var(--ink); margin: 0 0 12px; }

/* ---------- Topic detail ---------- */
.topic-layout { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: clamp(32px, 3vw, 64px); }
.topic { min-width: 0; }
.topic h1 { font-size: clamp(2rem, 1.3rem + 2.2vw, 3.4rem); margin: 0 0 18px; }
.topic-meta { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 30px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); }
.topic-meta .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.topic-tag { font-size: 0.76rem; color: var(--ink); background: var(--surface-2); padding: 1px 8px; }
.tldr { border: var(--b); border-left: 10px solid var(--accent); background: var(--surface); padding: 18px 24px; margin: 0; }
.tldr-label { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin: 0 0 6px; }
.tldr-text { font-size: 1.22rem; line-height: 1.6; margin: 0; color: var(--ink); max-width: var(--measure); }
.block { margin-top: 56px; scroll-margin-top: calc(var(--bar-h) + 24px); }
.block > h2 { font-size: 1.45rem; margin: 0 0 18px; padding-top: 14px; border-top: var(--b); }
.block-hint { margin: -6px 0 16px; color: var(--muted); font-size: 0.98rem; }
.prose { font-size: 1.125rem; line-height: 1.75; color: var(--ink-soft); }
.prose > :is(p, ul, ol, h3, h4, blockquote) { max-width: var(--measure); }
.prose p { margin: 0 0 1em; }
.prose > :last-child { margin-bottom: 0; }
.prose strong { color: var(--ink); font-weight: 700; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 0 1em; }
.prose li + li { margin-top: 6px; }
.prose li::marker { color: var(--ink); }
.prose h3, .prose h4 { font-size: 1.05rem; margin: 1.6em 0 0.5em; }
.prose :not(pre) > code { background: var(--code-inline); padding: 1px 5px; font-size: 0.86em; overflow-wrap: anywhere; color: var(--ink); }
.prose pre { background: var(--code-bg); border: var(--b); padding: 16px 18px; overflow-x: auto; font-size: 0.9rem; line-height: 1.6; max-width: 100%; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.table-wrap { overflow-x: auto; margin: 18px 0; border: var(--b); background: var(--surface); max-width: 100%; }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 1rem; line-height: 1.55; }
.table-wrap th, .table-wrap td { padding: 11px 16px; text-align: left; border-bottom: var(--b-thin); vertical-align: top; }
.table-wrap th + th, .table-wrap td + td { border-left: var(--b-thin); }
.table-wrap th { background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
.table-wrap tr:last-child td { border-bottom: 0; }
.table-wrap :not(pre) > code { overflow-wrap: normal; white-space: nowrap; }
.callout { padding: 18px 22px; background: var(--surface); border: var(--b); }
.callout.analogy { background: var(--accent-soft); }
.callout.pitfalls { background: var(--bad-soft); }
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }

/* Flow: an ordered pipeline of steps */
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; }
.flow li { display: inline-flex; align-items: center; gap: 8px; }
.flow-step { background: var(--surface); border: var(--b); padding: 9px 14px; font-size: 0.98rem; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.flow-step .i { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 800; color: var(--bg); background: var(--ink); padding: 0 6px; }
.flow-arrow { color: var(--ink); display: inline-flex; }
.flow-arrow .ic { width: 18px; height: 18px; }

/* Code */
.code { border: var(--b); background: var(--code-bg); margin: 16px 0; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px 0 16px; background: var(--ink); color: var(--bg); min-height: 38px; font-size: 0.86rem; }
.code-head b { font-weight: 600; color: var(--bg); }
.code-lang { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.copy { border: 1px solid transparent; background: transparent; padding: 4px 9px; font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; cursor: pointer; color: var(--bg); display: inline-flex; gap: 6px; align-items: center; }
.copy:hover { border-color: var(--bg); }
.copy .ic { width: 14px; height: 14px; }
.code pre { margin: 0; padding: 18px 20px; overflow-x: auto; font-size: 0.92rem; line-height: 1.65; tab-size: 2; }
.code pre code { font-size: inherit; background: none; color: var(--ink); }
.token.comment, .token.prolog, .token.doctype { color: var(--tok-comment); font-style: italic; }
.token.keyword, .token.boolean, .token.important, .token.atrule, .token.builtin { color: var(--tok-keyword); }
.token.string, .token.template-string, .token.char, .token.attr-value, .token.regex, .token.url { color: var(--tok-string); }
.token.number, .token.constant, .token.unit { color: var(--tok-number); }
.token.function, .token.class-name, .token.selector { color: var(--tok-func); }
.token.tag, .token.property, .token.deleted { color: var(--tok-tag); }
.token.attr-name, .token.parameter, .token.property-access { color: var(--tok-attr); }
.token.punctuation, .token.operator { color: var(--muted); }

/* Q&A: one framed list, rows divided by rules */
.qa { border: var(--b); background: var(--surface); }
.qa > *, .qa .answer, .flashcard > *, .topic, .block { min-width: 0; }
.qa details + details { border-top: var(--b-thin); }
.qa summary {
  cursor: pointer; padding: 16px 20px; font-weight: 600; font-size: 1.05rem; list-style: none; display: grid; line-height: 1.5;
  grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; color: var(--ink);
}
.qa summary:hover { background: var(--surface-2); }
.qa summary::-webkit-details-marker { display: none; }
.qa summary .caret { display: inline-flex; padding-top: 3px; }
.qa summary .caret .ic { width: 18px; height: 18px; }
.qa details[open] summary { background: var(--ink); color: var(--bg); }
.qa details[open] summary .caret { rotate: 90deg; }
.qa .answer { padding: 18px 20px 20px; font-size: 1.06rem; }
.qa .answer > :first-child { margin-top: 0; }
.qa .from { font-size: 0.95rem; margin-top: 14px; }
.qa .from a { display: inline-flex; align-items: center; gap: 6px; }
.qa-group { margin-bottom: 44px; }
.qa-group h2 { font-size: 1.15rem; margin: 0 0 14px; display: flex; gap: 12px; align-items: center; text-transform: uppercase; }

/* Self-check */
.self-check { background: var(--surface); border: var(--b); padding: 22px 24px; }
.self-check h2 { font-size: 1.15rem !important; margin: 0 0 6px !important; padding: 0 !important; border: 0 !important; text-transform: uppercase; }
.self-check p { margin: 0 0 16px; color: var(--muted); font-size: 0.98rem; }
.mark-btns { display: flex; gap: 12px; flex-wrap: wrap; }
.mark-btns .btn[aria-pressed="true"][data-v="known"] { background: var(--good-soft); color: var(--good); border-color: var(--good); box-shadow: 3px 3px 0 var(--good); }
.mark-btns .btn[aria-pressed="true"][data-v="review"] { background: var(--review-soft); color: var(--review); border-color: var(--review); box-shadow: 3px 3px 0 var(--review); }

/* Sources */
.sources { list-style: none; padding: 0; margin: 0; border-top: var(--b); }
.sources li { border-bottom: var(--b-thin); }
.sources a { display: flex; gap: 14px; align-items: baseline; padding: 12px 4px; text-decoration: none; color: var(--ink); font-weight: 500; }
.sources a:hover { background: var(--surface); color: var(--accent); }
.sources a > span:first-of-type { min-width: 0; overflow-wrap: anywhere; }
.sources .host { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-left: auto; text-align: right; white-space: nowrap; }
.sources .ic { color: var(--accent); width: 16px; height: 16px; align-self: center; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 64px; }
.pager a { padding: 16px 18px; border: var(--b); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; display: grid; gap: 4px; }
.pager a:hover { background: var(--ink); color: var(--bg); }
.pager a:hover span { color: var(--bg); }
.pager a span { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.pager a b { font-weight: 700; font-size: 1.02rem; }
.pager .next { text-align: right; grid-column: 2; }
.pager .next span { justify-content: flex-end; }

/* Page outline */
.toc { position: sticky; top: calc(var(--bar-h) + 40px); align-self: start; font-size: 0.95rem; }
.toc-title { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
.toc ol { list-style: none; margin: 0; padding: 0; border: var(--b); background: var(--surface); }
.toc li + li { border-top: var(--b-thin); }
.toc button { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 8px 14px; color: var(--ink); line-height: 1.4; }
.toc button:hover { background: var(--surface-2); }
.toc button[aria-current="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.toc-time { margin: 14px 0 0; font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }

/* ---------- Quiz and flashcards ---------- */
.panel { background: var(--surface); border: var(--b); padding: 30px 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: var(--b); background: var(--surface); padding: 6px 12px; cursor: pointer; border-radius: 0;
  font-size: 0.92rem; display: inline-flex; gap: 8px; align-items: center; color: var(--ink);
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.chip[aria-pressed="true"] .swatch { outline-color: var(--bg); }
.chip .pill { color: inherit; opacity: 0.8; }
.field { display: grid; gap: 12px; margin-bottom: 26px; }
.field > span { font-family: var(--font-mono); font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); }
.quiz-meta { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; color: var(--ink); margin-bottom: 12px; }
.quiz-meta span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.panel > .progress { margin-bottom: 26px; }
.quiz-q { font-size: 1.35rem; font-weight: 700; margin: 0 0 22px; line-height: 1.45; color: var(--ink); }
.options { display: grid; gap: 10px; }
.option {
  text-align: left; border: var(--b); background: var(--surface); padding: 14px 16px; font-size: 1.05rem;
  cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; color: var(--ink); line-height: 1.5;
}
.option:hover:not(:disabled) { background: var(--accent-soft); box-shadow: 3px 3px 0 var(--ink); }
.option .k { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 800; color: var(--bg); background: var(--ink); padding: 0 7px; margin-top: 2px; }
.option .res { display: inline-flex; padding-top: 2px; }
.option .res .ic { width: 20px; height: 20px; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .res { color: var(--good); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .res { color: var(--bad); }
.option:disabled { cursor: default; }
.option:disabled:not(.correct):not(.wrong) { color: var(--muted); }
.feedback { margin-top: 18px; padding: 16px 18px; line-height: 1.6; border: var(--b); }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 4px; }
.feedback .from { margin: 8px 0 0; }
.row-end { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
.row-end .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.score { font-family: var(--font-mono); font-size: 4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; margin: 0 0 10px; letter-spacing: -0.05em; }
.score small { font-size: 1.3rem; color: var(--muted); font-weight: 700; letter-spacing: 0; }
.mistakes { list-style: none; margin: 12px 0 0; padding: 0; border-top: var(--b); }
.mistakes li { border-bottom: var(--b-thin); }
.mistakes a { display: grid; gap: 2px; padding: 12px 4px; text-decoration: none; color: var(--ink); }
.mistakes a:hover { background: var(--surface-2); }
.mistakes a span { color: var(--muted); font-size: 0.96rem; }

.flash-meta { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; color: var(--ink); margin-bottom: 12px; }
.flash-wrap > .progress { margin-bottom: 20px; }
.flashcard {
  width: 100%; min-height: 360px; border: var(--b); background: var(--surface); box-shadow: var(--shadow);
  padding: clamp(24px, 3vw, 48px); cursor: pointer; text-align: left; display: grid; align-content: start; gap: 18px; color: var(--ink);
}
.flashcard:hover { background: var(--bg); }
.flashcard .side { font-family: var(--font-mono); font-size: 0.78rem; text-transform: uppercase; color: var(--ink); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.flashcard .side b { color: var(--bg); background: var(--accent); padding: 1px 8px; font-weight: 800; }
.flashcard .side span:last-child { display: inline-flex; align-items: center; gap: 8px; }
.flashcard .front { font-family: var(--font-display); font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.4rem); font-weight: 800; line-height: 1.3; letter-spacing: -0.03em; }
.flashcard .asked { font-weight: 700; font-size: 1.1rem; color: var(--ink); line-height: 1.5; padding-bottom: 16px; border-bottom: var(--b); }
.flashcard .back { font-size: 1.1rem; max-width: var(--measure); }
.flashcard .back > :first-child { margin-top: 0; }
.flash-controls { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 24px; flex-wrap: wrap; }
.flash-controls .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.hint { font-size: 0.9rem; color: var(--muted); }
.empty { padding: 40px; border: 2px dashed var(--ink); color: var(--muted); text-align: center; }
.empty b { color: var(--ink); display: block; margin-bottom: 6px; font-family: var(--font-mono); text-transform: uppercase; }

/* ---------- Checklist ---------- */
.cl-panel { display: grid; gap: 16px; padding: 22px 24px; margin-bottom: 20px; }
.cl-panel .progress { margin: 0; }
.cl-progress-head { font-size: 1.05rem; }
.cl-panel .field { margin: 0; }
.prio { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; padding: 1px 7px; border: 2px solid currentColor; white-space: nowrap; height: fit-content; }
.prio-critical { color: var(--bad); }
.prio-high { color: var(--review); }
.prio-medium { color: var(--accent); }
.prio-low { color: var(--muted); }
.cl-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 36px; }
.cl-toolbar .seg { flex: none; }
.cl-confirm { display: inline-flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 4px 4px 4px 14px; border: var(--b); background: var(--bad-soft); font-size: 0.98rem; }
.btn.danger { background: var(--bad); border-color: var(--ink); color: var(--accent-ink); }
.cl-cat { margin-bottom: 52px; }
.cl-cat-title { font-size: 1.6rem; margin: 0 0 6px; display: flex; gap: 12px; align-items: center; text-transform: uppercase; }
.cl-cat-title a { color: var(--ink); text-decoration: none; }
.cl-cat-title a:hover { text-decoration: underline; }
.cl-group { margin-top: 26px; }
.cl-group h3 { font-size: 1.05rem; margin: 0 0 8px; display: flex; gap: 12px; align-items: center; }
.cl-src { font-size: 0.9rem; color: var(--muted); margin: 0 0 12px; overflow-wrap: anywhere; }
.cl-src a { color: var(--ink); }
.cl-list { list-style: none; margin: 0; padding: 0; border: var(--b); background: var(--surface); }
.cl-rule { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 13px 18px; }
.cl-rule + .cl-rule { border-top: var(--b-thin); }
.cl-rule input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--ink); cursor: pointer; }
.cl-rule details { min-width: 0; }
.cl-rule summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; font-weight: 600; line-height: 1.5; }
.cl-rule summary::-webkit-details-marker { display: none; }
.cl-rule summary:hover .cl-title { text-decoration: underline; }
.cl-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cl-rule.is-done { background: var(--surface-2); }
.cl-rule.is-done .cl-title { text-decoration: line-through; color: var(--muted); }
.cl-body { padding-top: 10px; font-size: 1.04rem; }
.cl-body h4 { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); margin: 18px 0 6px; }
.cl-body .cl-why { margin: 4px 0; }
.cl-body .callout { margin-top: 14px; padding: 14px 18px; }
.cl-body .callout h4 { margin-top: 0; }
.cl-body .callout ul { margin: 4px 0 0; }
.cl-body .code { margin: 12px 0; }
.cl-body p { margin: 6px 0; }
.cl-body .cl-links { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: 0.96rem; }
.cl-links li + li { margin-top: 0; }
.cl-links .host { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); }
.cl-attrib { margin-top: 48px; font-size: 0.92rem; color: var(--muted); max-width: var(--measure); }

/* ---------- Color roles ----------
   Mode colors: library blue, questions purple, quiz red, flashcards yellow, checklist green.
   Category colors come from --hue (set inline per category). States: known green, review yellow, error red. */
.tab[data-mode="library"] { --m: var(--c-blue); --m-on: var(--on-fill); }
.tab[data-mode="pytania"] { --m: var(--c-purple); --m-on: var(--on-purple); }
.tab[data-mode="quiz"] { --m: var(--c-red); --m-on: var(--on-fill); }
.tab[data-mode="fiszki"] { --m: var(--c-yellow); --m-on: var(--on-fill); }
.tab[data-mode="checklista"] { --m: var(--c-green); --m-on: var(--on-fill); }
.tab:hover { background: color-mix(in srgb, var(--m) 22%, var(--surface)); }
.tab[aria-current="page"] { background: var(--m); color: var(--m-on); }
body[data-view="pytania"] { --mode: var(--c-purple); }
body[data-view="quiz"] { --mode: var(--c-red); }
body[data-view="fiszki"] { --mode: var(--c-yellow); }
body[data-view="checklista"] { --mode: var(--c-green); }
.view-head, .home-intro { border-bottom: 6px solid var(--mode); }
.progress span { background: var(--mode); }
.search input:focus { box-shadow: 3px 3px 0 var(--c-blue); }

.btn.primary { background: var(--c-yellow); color: var(--on-fill); }
.btn.primary:hover { background: color-mix(in srgb, var(--c-yellow) 75%, #fff); color: var(--on-fill); }

.cat-link[aria-current="true"][style*="--cat"] { background: var(--cat); color: var(--cat-on); }
.cat-link[aria-current="true"][style*="--cat"] .swatch { outline-color: var(--cat-on); }

.cat-item { box-shadow: inset 0 8px 0 var(--hue); padding-top: 30px; }
.cat-item:hover { background: color-mix(in srgb, var(--hue) 22%, var(--surface)); color: var(--ink); }
.cat-item:hover p, .cat-item:hover .meta { color: var(--ink-soft); }
.cat-item:hover .meta b, .cat-item:hover h3 { color: var(--ink); }
.modes .ic { background: var(--m); color: var(--m-on); border: var(--b); padding: 5px; width: 34px; height: 34px; margin-top: -4px; }

.level-mid { background: var(--c-blue); color: var(--on-fill); }
.level-senior { background: var(--c-purple); color: var(--on-purple); }
.status-tag.st-known { background: var(--c-green); color: var(--on-fill); border-color: var(--ink); }
.status-tag.st-review { background: var(--c-yellow); color: var(--on-fill); border-color: var(--ink); }
.mark-btns .btn[aria-pressed="true"][data-v="known"] { background: var(--c-green); color: var(--on-fill); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.mark-btns .btn[aria-pressed="true"][data-v="review"] { background: var(--c-yellow); color: var(--on-fill); border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
mark { color: var(--on-fill); }

.tldr { border-left-color: var(--hue, var(--c-blue)); background: color-mix(in srgb, var(--hue, var(--c-blue)) 12%, var(--surface)); }
.tldr-label { color: var(--ink); }
.flow-step .i { background: var(--hue, var(--ink)); color: var(--hue-on, var(--bg)); border: var(--b-thin); }
.toc button[aria-current="true"] { background: var(--hue, var(--ink)); color: var(--hue-on, var(--bg)); }
.callout.analogy { background: var(--t-blue); }
.callout.pitfalls { background: var(--t-red); }

.option:hover:not(:disabled) { background: color-mix(in srgb, var(--mode) 16%, var(--surface)); }
.option.correct { border-color: var(--ink); background: var(--t-green); box-shadow: inset 8px 0 0 var(--c-green); }
.option.wrong { border-color: var(--ink); background: var(--t-red); box-shadow: inset 8px 0 0 var(--c-red); }
.feedback.ok { background: var(--t-green); box-shadow: inset 8px 0 0 var(--c-green); }
.feedback.no { background: var(--t-red); box-shadow: inset 8px 0 0 var(--c-red); }
.flashcard .side b { background: var(--c-yellow); color: var(--on-fill); border: var(--b-thin); }

.prio { color: var(--on-fill); border: var(--b-thin); }
.prio-critical { background: var(--c-red); }
.prio-high { background: var(--c-yellow); }
.prio-medium { background: var(--c-blue); }
.prio-low { background: transparent; color: var(--ink); }
.cl-rule input { accent-color: var(--d-green); }
.cl-rule.is-done { background: var(--t-green); }
.btn.danger { background: var(--c-red); color: var(--on-fill); }

/* ---------- Motion (feedback and view changes only) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .is-entering { animation: view-in 0.22s var(--ease); }
  @keyframes view-in { from { opacity: 0; transform: translateY(6px); } }
  .btn, .chip, .option, .icon-btn, .copy, .seg button { transition: background-color 0.12s, color 0.12s, transform 0.1s var(--ease), box-shadow 0.1s var(--ease); }
  .btn:active, .chip:active, .icon-btn:active, .option:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
  .qa summary .caret { transition: rotate 0.16s var(--ease); }
  .flashcard .front, .flashcard .back { animation: view-in 0.2s var(--ease); }
  html { scroll-behavior: smooth; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
  .topic-layout { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 1100px) {
  .home-grid { grid-template-columns: minmax(0, 1fr); }
  :root { --rail-w: 236px; }
  .tab { padding: 0 12px; }
  .tab .count { display: none; }
  .seg button { padding: 7px 6px; }
}
@media (max-width: 900px) {
  .bar { position: static; }
  .bar-inner { height: auto; flex-wrap: wrap; padding: 12px 16px 0; gap: 12px; }
  .brand { width: auto; height: auto; padding: 0; border-right: 0; }
  .brand { order: 1; }
  .bar-tools { order: 2; flex: 1 1 200px; margin-left: auto; }
  .tabs { order: 3; width: calc(100% + 32px); height: 48px; margin: 0 -16px; border-top: var(--b); }
  .tab { flex: 1 0 auto; justify-content: center; padding: 0 10px; font-size: 0.74rem; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; overflow: visible; border-right: 0; border-bottom: var(--b); padding: 14px 16px; gap: 12px; }
  .rail .rail-label { display: none; }
  .level-block { padding: 0; }
  .rail ul { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; border-top: 0; scrollbar-width: none; }
  .rail li { border-bottom: 0; }
  .cat-link { width: auto; white-space: nowrap; border: var(--b); padding: 6px 12px; }
  main { padding: 28px 16px 80px; }
  .search kbd { display: none; }
  .block { scroll-margin-top: 16px; }
  /* Reading a topic on a phone: the breadcrumb is enough navigation, text starts right away */
  [data-view="topic"] .rail { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .brand { font-size: 0.9rem; }
  .progress-nums b { font-size: 1.6rem; }
  .progress-nums > div { padding: 10px; }
  .box, .panel, .self-check { padding: 18px; }
  .flashcard { min-height: 280px; box-shadow: 3px 3px 0 var(--ink); }
  .cat-index { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: auto minmax(0, 1fr); padding-inline: 4px; }
  .trow .meta { grid-column: 2; grid-row: 2; }
  .trow p { grid-column: 2; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  .sources .host { display: none; }
  .head-actions .btn { flex: 1 1 auto; }
  .modes .pill { display: none; }
  .prose { font-size: 1.06rem; }
  .tab { padding: 0 8px; letter-spacing: 0.02em; }
}
