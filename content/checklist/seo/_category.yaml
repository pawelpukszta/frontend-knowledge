      - sitemap
      - all-noindex-pages
      - broken-html
      - canonical-chain
      - html-size
      - https-downgrade
      - hyphens
      - indexability-conflicts
      - indexability
      - pagination
      - parameters
      - pdf-size
      - mime-type
  - name: "Techniczne SEO: dane strukturalne"
    sources:
      - title: "Google: Search gallery of structured data"
        url: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
      - title: Schema.org
        url: https://schema.org/
    rules:
