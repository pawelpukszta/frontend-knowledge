    rules:
      - unit-tests
      - integration-testing
      - e2e-testing
      - contract-testing
      - mock-best-practices
      - test-coverage
      - mutation-testing
  - name: Przeglądarki, urządzenia i specjalistyczne testy
    sources:
      - title: "web.dev: Baseline"
        url: https://web.dev/baseline
    rules:
      - cross-browser-testing
      - mobile-testing
      - accessibility-testing
      - visual-regression
      - performance-budget
  - name: Monitoring
    sources:
      - title: "Sentry: JavaScript"
        url: https://docs.sentry.io/platforms/javascript/
