<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Baza wiedzy front-end: biblioteka zagadnień, pytania z rozmów, quiz, fiszki i checklista.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Baza wiedzy FE</title>
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try { const t = localStorage.getItem('kbfe:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* storage unavailable */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
