order: 9
name: Testy i jakość
desc: Strategia testów, testy przeglądarek i urządzeń, dostępności, wydajności oraz monitoring błędów na produkcji.
hue: system
sources:
  - title: "Testing Library: Guiding Principles"
    url: https://testing-library.com/docs/guiding-principles
  - title: "Playwright: Best Practices"
    url: https://playwright.dev/docs/best-practices
groups:
  - name: Strategia testów
    sources:
      - title: "Kent C. Dodds: The Testing Trophy"
