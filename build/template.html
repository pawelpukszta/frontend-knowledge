    return a;
  };
  const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const plural = (n, one, few, many) => {
    if (n === 1) return one;
    const d = n % 10, t = n % 100;
    return d >= 2 && d <= 4 && (t < 12 || t > 14) ? few : many;
  };
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Search index: title weighs most, then tags/summary, then body and Q&A
  const INDEX = TOPICS.map((t) => ({
    id: t.id,
    title: norm(t.title),
    meta: norm([t.tags.join(' '), stripHtml(t.summaryHtml)].join(' ')),
    body: norm([stripHtml(t.body || ''), stripHtml(t.analogy || ''), t.qa.map((q) => stripHtml(q.q + ' ' + q.a)).join(' '), t.code.map((c) => c.src).join(' ')].join(' ')),
  }));

  // Estimated reading time: prose + Q&A at ~180 words per minute (technical Polish text)
  const readMinutes = (t) => {
    const text = [t.summaryHtml, t.body || '', t.analogy || '', t.pitfalls || '', ...t.qa.map((q) => q.q + ' ' + q.a)].map(stripHtml).join(' ');
    return Math.max(1, Math.round(text.split(/\s+/).filter(Boolean).length / 180));
  };

  // ---------- State ----------
  const state = {
    mode: 'library',
    level: store.get('level', 'all'),
    cat: null,        // category filter for pytania / fiszki / quiz setup
    query: '',
    quiz: null,
    flash: null,
    clCat: null,
    clPrio: store.get('clPrio', []),   // empty = all priorities
    clStatus: 'all',                    // all | todo | done
    clDone: new Set(store.get('clDone', [])),
    clConfirmReset: false,
    // Learning progress, stored per browser
    seen: new Set(store.get('seen', [])),   // topic ids opened at least once
    mastery: store.get('mastery', {}),      // topic id -> 'known' | 'review'
    last: store.get('last', null),          // last opened topic id
  };
  const saveCl = () => { store.set('clDone', [...state.clDone]); store.set('clPrio', state.clPrio); };
  const saveProgress = () => { store.set('seen', [...state.seen]); store.set('mastery', state.mastery); store.set('last', state.last); };
  const levelOk = (lvl) => state.level === 'all' || lvl === state.level;

  const STATUS = {
    new: { icon: 'circle', label: 'Nieprzeczytane' },
    read: { icon: 'eye', label: 'Przeczytane' },
    review: { icon: 'review', label: 'Do powtórki' },
    known: { icon: 'checkCircle', label: 'Umiem' },
  };
  const statusOf = (t) => state.mastery[t.id] || (state.seen.has(t.id) ? 'read' : 'new');
  const statusIcon = (t) => {
    const s = statusOf(t);
    return `<span class="st st-${s}" title="${STATUS[s].label}">${icon(STATUS[s].icon)}<span class="sr-only">${STATUS[s].label}</span></span>`;
  };

  // ---------- Theme ----------
  const currentTheme = () => document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const applyTheme = (t) => {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const dark = currentTheme() === 'dark';
    $('#theme').innerHTML = icon(dark ? 'sun' : 'moon');
    $('#theme').setAttribute('aria-label', dark ? 'Włącz jasny motyw' : 'Włącz ciemny motyw');
  };
  applyTheme(store.get('theme', null));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(store.get('theme', null)));
  $('#theme').addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    store.set('theme', next);
  });

  // ---------- Chrome (tabs, rail, level) ----------
  $('#count-qa').textContent = QA.length;
  $('#count-cl').textContent = CL_RULES.length;

  function renderChrome() {
    document.querySelectorAll('.tab').forEach((b) => {
      if (b.dataset.mode === state.mode) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    document.querySelectorAll('[data-level]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.level === state.level)));
    // Level only filters topics and interview questions; quiz and checklist ignore it
    $('#level-block').hidden = state.mode === 'checklista' || state.mode === 'quiz';
    if (state.mode === 'checklista') { renderClRail(); return; }
    const activeCat = state.mode === 'library' ? currentLibraryCat() : state.cat;
    const allLabel = state.mode === 'library' ? 'Start' : 'Wszystkie kategorie';
    const allCount = state.mode === 'library' ? TOPICS.filter((t) => levelOk(t.level)).length
      : state.mode === 'quiz' ? QUIZ.length : QA.filter((q) => levelOk(q.level)).length;
    const counter = (c) => state.mode === 'library' ? TOPICS.filter((t) => t.category === c.id && levelOk(t.level)).length
      : state.mode === 'quiz' ? QUIZ.filter((q) => q.category === c.id).length
      : QA.filter((q) => q.category === c.id && levelOk(q.level)).length;
    $('#rail').innerHTML = [
      `<li><button class="cat-link" type="button" data-cat="" aria-current="${!activeCat}"><span class="swatch" style="background: var(--surface-2)"></span>${allLabel}<span class="n">${allCount}</span></button></li>`,
      ...CATS.map((c) => `<li><button class="cat-link" type="button" data-cat="${c.id}" aria-current="${activeCat === c.id}" style="--cat:${hue(c.id)}; --cat-on:${hueOn(c.hue)}"><span class="swatch" style="background:${hue(c.id)}"></span>${esc(c.name)}<span class="n">${counter(c)}</span></button></li>`),
    ].join('');
    const unit = state.mode === 'library' ? 'zagadnienia' : state.mode === 'quiz' ? 'pytania quizu' : 'pytania';
    $('#rail-unit').textContent = unit;
    document.querySelectorAll('#rail .n').forEach((n) => { n.title = `${n.textContent} ${unit}`; });
  }

  function renderClRail() {
    const doneIn = (rules) => rules.filter((r) => state.clDone.has(r.key)).length;
    const row = (id, name, hueVar, rules, on) => `<li><button class="cat-link" type="button" data-cat="${id}" aria-current="${(state.clCat || '') === id}"${on ? ` style="--cat:${hueVar}; --cat-on:${on}"` : ''}><span class="swatch" style="background:${hueVar}"></span>${esc(name)}<span class="n" title="${doneIn(rules)} z ${rules.length} reguł zrobione">${doneIn(rules)}/${rules.length}</span></button></li>`;
    $('#rail').innerHTML = [
      row('', 'Wszystkie reguły', 'var(--surface-2)', CL_RULES),
      ...CL.map((c) => row(c.id, c.name, `var(--hue-${CL_HUE[c.id] || 'system'})`, CL_RULES.filter((r) => r.cat === c.id), hueOn(CL_HUE[c.id]))),
    ].join('');
    $('#rail-unit').textContent = 'zrobione';
  }

  function currentLibraryCat() {
    const h = location.hash.slice(1);
    if (h.startsWith('c-')) return h.slice(2);
    if (TOPIC[h]) return TOPIC[h].category;
    return null;
  }

  $('#rail').addEventListener('click', (e) => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    const id = b.dataset.cat || null;
    if (state.mode === 'library') {
      clearQuery();
      go(id ? `c-${id}` : 'start');
    } else if (state.mode === 'checklista') {
      go(id ? `cl-${id}` : 'checklista');
    } else {
      state.cat = id;
      if (state.mode === 'quiz') { state.quiz = null; state.quizCats = id ? [id] : []; }
      if (state.mode === 'fiszki') state.flash = null;
      render(true);
    }
  });

  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    const m = b.dataset.mode;
    go(m === 'library' ? 'start' : m);
  }));

  document.querySelectorAll('[data-level]').forEach((b) => b.addEventListener('click', () => {
    state.level = b.dataset.level;
    store.set('level', state.level);
    state.flash = null;
    render();
  }));

  // ---------- Search ----------
  const qInput = $('#q');
  let qTimer;
  qInput.addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.query = qInput.value.trim();
      if (state.mode === 'quiz' || state.mode === 'fiszki') { go('start'); return; }
      render();
    }, 120);
  });
  function clearQuery() { state.query = ''; qInput.value = ''; }

  function searchTopics(q) {
    const terms = norm(q).split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    return INDEX.map((ix) => {
      let score = 0;
      for (const term of terms) {
        const s = (ix.title.includes(term) ? 10 : 0) + (ix.meta.includes(term) ? 4 : 0) + (ix.body.includes(term) ? 1 : 0);
        if (!s) return null; // every term must match somewhere
        score += s;
      }
      return { t: TOPIC[ix.id], score };
    }).filter(Boolean).filter((r) => levelOk(r.t.level)).sort((a, b) => b.score - a.score).map((r) => r.t);
  }

  function highlight(html, q) {
    const terms = q.split(/\s+/).filter((t) => t.length > 1).map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!terms.length) return html;
    const re = new RegExp(`(${terms.join('|')})`, 'gi');
    return html.split(/(<[^>]+>)/).map((part) => (part.startsWith('<') ? part : part.replace(re, '<mark>$1</mark>'))).join('');
  }

  // ---------- Router ----------
  function go(hash) {
    if (location.hash.slice(1) === hash) route();
    else location.hash = hash;
  }
  function route() {
    const h = location.hash.slice(1) || 'start';
    if (h === 'pytania' || h === 'quiz' || h === 'fiszki') state.mode = h;
    else if (h === 'checklista' || (h.startsWith('cl-') && CL_CAT[h.slice(3)])) {
      state.mode = 'checklista';
      state.clCat = h === 'checklista' ? null : h.slice(3);
      state.clConfirmReset = false;
    } else state.mode = 'library';
    render(true);
  }
  window.addEventListener('hashchange', () => { route(); window.scrollTo({ top: 0, behavior: 'instant' }); });

  // ---------- Renderers ----------
  const view = $('#view');
  let tocObserver = null;

  // entering = true on navigation: the new view fades in once; in-place updates stay still
  function render(entering = false) {
    tocObserver?.disconnect();
    tocObserver = null;
    renderChrome();
    const h = location.hash.slice(1) || 'start';
    document.body.dataset.view = state.mode === 'library' && !state.query && TOPIC[h] ? 'topic' : state.mode;
    if (state.mode === 'pytania') renderQA();
    else if (state.mode === 'quiz') renderQuiz();
    else if (state.mode === 'fiszki') renderFlash();
    else if (state.mode === 'checklista') renderChecklist();
    else if (state.query) renderSearch();
    else if (TOPIC[h]) renderTopic(TOPIC[h]);
    else if (h.startsWith('c-') && CAT[h.slice(2)]) renderCategory(CAT[h.slice(2)]);
    else if (h === 'powtorka') renderReview();
    else renderHome();
    enhance(view);
    if (entering && !reduceMotion()) {
      view.classList.remove('is-entering');
      void view.offsetWidth; // restart the animation
      view.classList.add('is-entering');
    }
  }
  view.addEventListener('animationend', (e) => { if (e.target === view) view.classList.remove('is-entering'); });

  function topicRow(t, q = '') {
    return `<a class="trow" href="#${t.id}">
      ${statusIcon(t)}
      <h3>${q ? highlight(esc(t.title), q) : esc(t.title)}</h3>
      <span class="meta"><span class="level level-${t.level}">${t.level}</span><span class="pill">${t.qa.length} ${plural(t.qa.length, 'pytanie', 'pytania', 'pytań')}</span></span>
      <p>${q ? highlight(t.summaryHtml, q) : t.summaryHtml}</p>
    </a>`;
  }

  function renderHome() {
    document.title = 'Baza wiedzy FE';
    const visible = TOPICS.filter((t) => levelOk(t.level));
    const read = visible.filter((t) => state.seen.has(t.id)).length;
    const known = visible.filter((t) => state.mastery[t.id] === 'known').length;
    const review = visible.filter((t) => state.mastery[t.id] === 'review');
    const last = state.last && TOPIC[state.last];
    const firstUnread = visible.find((t) => !state.seen.has(t.id));
    const startTarget = last || firstUnread || visible[0];
    const pct = visible.length ? Math.round((read / visible.length) * 100) : 0;
    const levelNote = state.level !== 'all' ? ` na poziomie ${state.level}` : ' dla mid i senior';
    const modes = [
      ['pytania', 'question', 'Pytania z rozmów', 'Odpowiedz na głos, potem porównaj z modelową odpowiedzią.', QA.filter((q) => levelOk(q.level)).length],
      ['quiz', 'exam', 'Quiz', 'Pytania jednokrotnego wyboru. Błędne odpowiedzi trafiają do powtórki.', QUIZ.length],
      ['fiszki', 'cards', 'Fiszki', 'Szybka powtórka: odwróć kartę i oceń, czy umiesz.', QA.filter((q) => levelOk(q.level)).length],
      ['checklista', 'listChecks', 'Checklista', 'Reguły jakości do odhaczenia w prawdziwym projekcie.', CL_RULES.length],
    ];
    view.innerHTML = `
      <section class="home-intro">
        <h1>Co dziś powtarzasz?</h1>
        <p class="lede">${visible.length} zagadnień front-end${levelNote}. Każde ma wyjaśnienie, przykład kodu, pytania z rozmów i źródła.</p>
        <div class="head-actions">
          ${startTarget ? `<a class="btn primary" href="#${startTarget.id}">${last ? 'Kontynuuj naukę' : 'Zacznij naukę'}${icon('arrowRight')}</a>` : ''}
          <button class="btn" type="button" data-act="random">${icon('shuffle')}Losowe zagadnienie</button>
        </div>
      </section>
      <div class="home-grid">
        <section class="box" aria-labelledby="h-progress">
          <h2 class="sec" id="h-progress">Twój postęp</h2>
          <div class="progress-nums">
            <div><b>${read}<small>/${visible.length}</small></b><span>${icon('eye')}przeczytane</span></div>
            <div class="pn-known"><b>${known}</b><span>${icon('checkCircle')}umiem</span></div>
            <div class="pn-review"><b>${review.length}</b><span>${icon('review')}do powtórki</span></div>
          </div>
          <div class="progress" role="progressbar" aria-label="Przeczytane zagadnienia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
          ${last ? `<p class="last-read">Ostatnio czytane: <a href="#${last.id}">${esc(last.title)}</a></p>` : ''}
          <div class="review-head"><h3>Do powtórki</h3>${review.length > 5 ? `<a href="#powtorka">Wszystkie (${review.length})</a>` : ''}</div>
          ${review.length ? `<ul class="review-list">${review.slice(0, 5).map((t) => `<li><a href="#${t.id}">${statusIcon(t)}<span>${esc(t.title)}</span><span class="cat-short">${esc(CAT[t.category].short || CAT[t.category].name)}</span></a></li>`).join('')}</ul>`
            : `<p class="empty-note">Pusto. Zagadnienia oznaczone jako „Do powtórki” i błędne odpowiedzi z quizu pojawią się tutaj.</p>`}
        </section>
        <section class="box" aria-labelledby="h-modes">
          <h2 class="sec" id="h-modes">Tryby nauki</h2>
          <ul class="modes">${modes.map(([href, ic, title, desc, n]) => `<li><a href="#${href}" style="--m:var(--c-${MODE_COLOR[href][0]}); --m-on:var(--${MODE_COLOR[href][1]})">${icon(ic)}<b>${title}</b><span class="pill">${n}</span><small>${desc}</small></a></li>`).join('')}</ul>
        </section>
      </div>
      <section aria-labelledby="h-cats">
        <h2 class="sec" id="h-cats">Kategorie</h2>
        <div class="cat-index">
          ${CATS.map((c) => {
            const ts = visible.filter((t) => t.category === c.id);
            const r = ts.filter((t) => state.seen.has(t.id)).length;
            const k = ts.filter((t) => state.mastery[t.id] === 'known').length;
            return `<a class="cat-item" href="#c-${c.id}" style="${catStyle(c.id)}">
              <h3><span class="swatch" style="background:${hue(c.id)}"></span>${esc(c.name)}</h3>
              <p>${esc(c.desc)}</p>
              <span class="meta"><b>${r} z ${ts.length}</b> przeczytane${k ? `, ${k} umiem` : ''}</span>
            </a>`;
          }).join('')}
        </div>
      </section>`;
  }

  function renderReview() {
    document.title = 'Do powtórki · Baza wiedzy FE';
    const ts = TOPICS.filter((t) => state.mastery[t.id] === 'review' && levelOk(t.level));
    view.innerHTML = `
      <nav class="crumbs" aria-label="Ścieżka"><a href="#start">Start</a><span aria-hidden="true">/</span><span>Do powtórki</span></nav>
      <div class="view-head">
        <h1>Do powtórki</h1>
        <p class="lede">Zagadnienia oznaczone ręcznie lub z błędną odpowiedzią w quizie. Gdy coś opanujesz, oznacz je jako „Umiem”.</p>
      </div>
      ${ts.length ? `<div class="tlist">${ts.map((t) => topicRow(t)).join('')}</div>`
        : `<div class="empty"><b>Nic do powtórki</b>Oznacz zagadnienie przyciskiem „Do powtórki” albo rozwiąż quiz.</div>`}`;
  }

  function renderCategory(c) {
    document.title = `${c.name} · Baza wiedzy FE`;
    const ts = TOPICS.filter((t) => t.category === c.id && levelOk(t.level));
    const r = ts.filter((t) => state.seen.has(t.id)).length;
    view.innerHTML = `
      <nav class="crumbs" aria-label="Ścieżka"><a href="#start">Start</a><span aria-hidden="true">/</span><span>${esc(c.name)}</span></nav>
      <div class="view-head" style="--mode:${hue(c.id)}">
        <h1>${esc(c.name)}</h1>
        <p class="lede">${esc(c.desc)}</p>
        <div class="head-actions">
          <button class="btn" type="button" data-act="quiz-cat" data-cat="${c.id}">${icon('exam')}Quiz z kategorii</button>
          <button class="btn" type="button" data-act="flash-cat" data-cat="${c.id}">${icon('cards')}Fiszki z kategorii</button>
        </div>
      </div>
      ${ts.length ? `<p class="cat-progress">Przeczytane: ${r} z ${ts.length}</p><div class="tlist">${ts.map((t) => topicRow(t)).join('')}</div>`
        : `<div class="empty"><b>Brak zagadnień na poziomie ${state.level}</b>Zmień filtr poziomu w panelu bocznym.</div>`}`;
  }

  function renderSearch() {
    document.title = `Szukaj: ${state.query} · Baza wiedzy FE`;
    const res = searchTopics(state.query);
    const qaHits = QA.filter((q) => levelOk(q.level) && norm(stripHtml(q.q)).includes(norm(state.query))).slice(0, 8);
    view.innerHTML = `
      <div class="view-head">
        <h1>Wyniki dla „${esc(state.query)}”</h1>
        <p class="lede">${res.length} ${plural(res.length, 'zagadnienie', 'zagadnienia', 'zagadnień')}${state.level !== 'all' ? ` na poziomie ${state.level}` : ''}. <kbd>Esc</kbd> czyści wyszukiwanie.</p>
      </div>
      ${res.length ? `<div class="tlist">${res.map((t) => topicRow(t, state.query)).join('')}</div>`
        : `<div class="empty"><b>Nic nie znaleziono</b>Spróbuj innego słowa, np. „promise”, „hydration”, „aria”.</div>`}
      ${qaHits.length ? `<section class="block qa-group"><h2>Pasujące pytania z rozmów</h2><div class="qa">${qaHits.map((q) => qaItem(q, true)).join('')}</div></section>` : ''}`;
  }

  function qaItem(q, withSource = false) {
    return `<details>
      <summary><span>${q.q}</span><span class="caret" aria-hidden="true">${icon('caret')}</span></summary>
      <div class="answer prose">${q.a}${withSource ? `<p class="from"><a href="#${q.topic}">Zagadnienie: ${esc(TOPIC[q.topic].title)}${icon('arrowRight')}</a></p>` : ''}</div>
    </details>`;
  }

  function renderTopic(t) {
    document.title = `${t.title} · Baza wiedzy FE`;
    const c = CAT[t.category];
    if (!state.seen.has(t.id) || state.last !== t.id) {
      state.seen.add(t.id);
      state.last = t.id;
      saveProgress();
    }
    const siblings = TOPICS.filter((x) => x.category === t.category);
    const i = siblings.indexOf(t);
    const prev = siblings[i - 1], next = siblings[i + 1];
    const status = statusOf(t);
    const mins = readMinutes(t);
    const sections = [];
    const sec = (id, title, html) => { sections.push([id, title]); return `<section class="block" id="sec-${id}" aria-labelledby="h-${id}"><h2 id="h-${id}">${title}</h2>${html}</section>`; };
    const body = [
      t.body ? sec('wyjasnienie', 'Wyjaśnienie', `<div class="prose">${t.body}</div>`) : '',
      t.flow ? sec('przeplyw', 'Przepływ', `<ol class="flow">${t.flow.map((s, n) =>
        `<li>${n ? `<span class="flow-arrow" aria-hidden="true">${icon('arrowRight')}</span>` : ''}<span class="flow-step"><span class="i">${n + 1}</span>${esc(s)}</span></li>`).join('')}</ol>`) : '',
      t.analogy ? sec('analogia', 'Analogia', `<div class="callout analogy prose">${t.analogy}</div>`) : '',
      t.code.length ? sec('kod', 'Przykład kodu', t.code.map((b) => codeBlockHTML(b, 'javascript')).join('')) : '',
      t.pitfalls ? sec('bledy', 'Częste błędy', `<div class="callout pitfalls prose">${t.pitfalls}</div>`) : '',
      t.qa.length ? sec('rozmowa', 'Na rozmowie', `<p class="block-hint">Spróbuj odpowiedzieć na głos, zanim rozwiniesz odpowiedź.</p><div class="qa">${t.qa.map((qa) => qaItem({ ...qa, category: t.category })).join('')}</div>`) : '',
      sec('ocena', 'Jak ci poszło?', ''),
      sec('zrodla', 'Źródła', `<ul class="sources">${t.sources.map((s) =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><span>${esc(s.title)}</span><span class="host">${host(s.url)}</span>${icon('external')}</a></li>`).join('')}</ul>`),
    ].join('');
    view.innerHTML = `
      <div class="topic-layout" style="${catStyle(t.category)}">
        <article class="topic">
          <nav class="crumbs" aria-label="Ścieżka"><a href="#start">Start</a><span aria-hidden="true">/</span><a href="#c-${c.id}">${esc(c.name)}</a></nav>
          <h1>${esc(t.title)}</h1>
          <div class="topic-meta">
            <span class="level level-${t.level}">${t.level}</span>
            <span>${mins} min czytania</span>
            ${status === 'known' || status === 'review' ? `<span class="status-tag st-${status}">${icon(STATUS[status].icon)}${STATUS[status].label}</span>` : ''}
            <span class="tags">${t.tags.map((g) => `<span class="topic-tag">${esc(g)}</span>`).join('')}</span>
          </div>
          <div class="tldr"><p class="tldr-label">W skrócie</p><p class="tldr-text">${t.summaryHtml}</p></div>
          ${body}
          <nav class="pager" aria-label="Sąsiednie zagadnienia">
            ${prev ? `<a class="prev" href="#${prev.id}"><span>${icon('arrowLeft')}Poprzednie</span><b>${esc(prev.title)}</b></a>` : ''}
            ${next ? `<a class="next" href="#${next.id}"><span>Następne${icon('arrowRight')}</span><b>${esc(next.title)}</b></a>` : ''}
          </nav>
        </article>
        <nav class="toc" aria-label="Na tej stronie">
          <p class="toc-title">Na tej stronie</p>
          <ol>${sections.map(([id, title]) => `<li><button type="button" data-act="toc" data-target="sec-${id}">${title}</button></li>`).join('')}</ol>
          <p class="toc-time">${mins} min czytania, ${t.qa.length} ${plural(t.qa.length, 'pytanie', 'pytania', 'pytań')}</p>
        </nav>
      </div>`;
    // The self-check block is rendered separately so marking does not rebuild the article
    $('#sec-ocena').classList.add('self-check');
    renderSelfCheck(t);
    observeToc();
  }

  function renderSelfCheck(t) {
    const m = state.mastery[t.id];
    const box = $('#sec-ocena');
    box.innerHTML = `<h2 id="h-ocena">Jak ci poszło?</h2>
      <p>Oznacz zagadnienie. Te do powtórki zbierają się na stronie startowej.</p>
      <div class="mark-btns">
        <button class="btn" type="button" data-act="mark" data-v="known" aria-pressed="${m === 'known'}">${icon('checkCircle')}Umiem</button>
        <button class="btn" type="button" data-act="mark" data-v="review" aria-pressed="${m === 'review'}">${icon('review')}Do powtórki</button>
      </div>`;
    const meta = $('.topic-meta');
    meta.querySelector('.status-tag')?.remove();
    if (m) meta.querySelector('.tags').insertAdjacentHTML('beforebegin', `<span class="status-tag st-${m}">${icon(STATUS[m].icon)}${STATUS[m].label}</span>`);
  }

  // Highlight the outline entry of the section currently being read
  function observeToc() {
    const links = [...view.querySelectorAll('.toc [data-target]')];
    if (!links.length || !('IntersectionObserver' in window)) return;
    const setActive = (id) => links.forEach((l) => l.setAttribute('aria-current', String(l.dataset.target === id)));
    tocObserver = new IntersectionObserver((entries) => {
      const hit = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (hit) setActive(hit.target.id);
    }, { rootMargin: '-20% 0px -65% 0px' });
    links.forEach((l) => { const s = document.getElementById(l.dataset.target); if (s) tocObserver.observe(s); });
  }

  function renderQA() {
    document.title = 'Pytania rekrutacyjne · Baza wiedzy FE';
    const nq = norm(state.query);
    const items = QA.filter((q) => levelOk(q.level) && (!state.cat || q.category === state.cat)
      && (!nq || norm(stripHtml(q.q + ' ' + q.a)).includes(nq)));
    const groups = CATS.map((c) => ({ c, list: items.filter((q) => q.category === c.id) })).filter((g) => g.list.length);
    view.innerHTML = `
      <div class="view-head">
        <h1>${state.cat ? `Pytania: ${esc(CAT[state.cat].name)}` : 'Pytania z rozmów'}</h1>
        <p class="lede">${items.length} ${plural(items.length, 'pytanie', 'pytania', 'pytań')}. Odpowiedz na głos, zanim rozwiniesz odpowiedź. Tak ćwiczysz przywoływanie z pamięci, a nie rozpoznawanie.</p>
        <div class="head-actions">
          <button class="btn" type="button" data-act="expand">Rozwiń wszystkie</button>
          <button class="btn ghost" type="button" data-act="collapse">Zwiń wszystkie</button>
        </div>
      </div>
      ${groups.length ? groups.map((g) => `<section class="qa-group"><h2><span class="swatch" style="background:${hue(g.c.id)}"></span>${esc(g.c.name)} <span class="pill">${g.list.length}</span></h2>
        <div class="qa">${g.list.map((q) => qaItem(q, true)).join('')}</div></section>`).join('')
        : '<div class="empty"><b>Brak pytań dla wybranych filtrów</b>Zmień poziom lub kategorię.</div>'}`;
  }

  // ---------- Quiz ----------
  function renderQuiz() {
    document.title = 'Quiz · Baza wiedzy FE';
    const qz = state.quiz;
    if (!qz) return renderQuizSetup();
    if (qz.i >= qz.items.length) return renderQuizResult();
    const item = qz.items[qz.i];
    const answered = qz.picked != null;
    const done = qz.i + (answered ? 1 : 0);
    view.innerHTML = `
      <div class="quiz-meta"><span><span class="swatch" style="background:${hue(item.category)}"></span>${esc(CAT[item.category].name)}</span><span>Pytanie ${qz.i + 1} z ${qz.items.length}, wynik ${qz.score}/${done}</span></div>
      <div class="panel">
        <div class="progress" role="progressbar" aria-label="Postęp quizu" aria-valuemin="0" aria-valuemax="${qz.items.length}" aria-valuenow="${done}"><span style="width:${(done / qz.items.length) * 100}%"></span></div>
        <p class="quiz-q">${item.q}</p>
        <div class="options">${item.order.map((oi, n) => {
          const cls = answered ? (oi === item.answer ? 'correct' : oi === qz.picked ? 'wrong' : '') : '';
          return `<button class="option ${cls}" type="button" data-act="pick" data-opt="${oi}" ${answered ? 'disabled' : ''}><span class="k">${n + 1}</span><span>${item.options[oi]}</span><span class="res">${cls === 'correct' ? `${icon('check')}<span class="sr-only">Poprawna odpowiedź</span>` : cls === 'wrong' ? `${icon('x')}<span class="sr-only">Twoja odpowiedź, błędna</span>` : ''}</span></button>`;
        }).join('')}</div>
        ${answered ? `<div class="feedback ${qz.picked === item.answer ? 'ok' : 'no'}" role="status">
          <b>${qz.picked === item.answer ? 'Dobrze!' : 'Nie tym razem. Zagadnienie trafiło do powtórki.'}</b>${item.explain || ''}
          <p class="from"><a href="#${item.topic}">Powtórz zagadnienie: ${esc(TOPIC[item.topic].title)}</a></p></div>` : ''}
        <div class="row-end">
          <span class="hint">Klawisze <kbd>1</kbd>-<kbd>${item.order.length}</kbd> wybierają odpowiedź, <kbd>Enter</kbd> przechodzi dalej</span>
          <span class="btns">
            <button class="btn ghost" type="button" data-act="quiz-exit">Zakończ</button>
            ${answered ? `<button class="btn primary" type="button" data-act="quiz-next" id="quiz-next">${qz.i + 1 < qz.items.length ? 'Następne pytanie' : 'Zobacz wynik'}${icon('arrowRight')}</button>` : ''}
          </span>
        </div>
      </div>`;
    if (answered) $('#quiz-next')?.focus();
  }

  function renderQuizSetup() {
    const cats = state.quizCats || (state.cat ? [state.cat] : []);
    state.quizCats = cats;
    const pool = QUIZ.filter((q) => !cats.length || cats.includes(q.category));
    const count = state.quizCount || 10;
    view.innerHTML = `
      <div class="view-head">
        <h1>Quiz</h1>
        <p class="lede">Pytania jednokrotnego wyboru. Po każdej odpowiedzi zobaczysz wyjaśnienie, a błędy trafią na listę do powtórki.</p>
      </div>
      <div class="panel">
        <div class="field"><span>Kategorie</span>
          <div class="chips">
            <button class="chip" type="button" data-act="qcat" data-cat="" aria-pressed="${!cats.length}">Wszystkie</button>
            ${CATS.map((c) => `<button class="chip" type="button" data-act="qcat" data-cat="${c.id}" aria-pressed="${cats.includes(c.id)}"><span class="swatch" style="background:${hue(c.id)}"></span>${esc(c.short || c.name)}</button>`).join('')}
          </div>
        </div>
        <div class="field"><span>Liczba pytań</span>
          <div class="chips">${[5, 10, 20, 0].map((n) => `<button class="chip" type="button" data-act="qcount" data-n="${n}" aria-pressed="${count === n}">${n || 'Wszystkie'}</button>`).join('')}</div>
        </div>
        <div class="row-end">
          <span class="muted">Dostępne pytania: ${pool.length}</span>
          <button class="btn primary" type="button" data-act="quiz-start" ${pool.length ? '' : 'disabled'}>Rozpocznij quiz${icon('arrowRight')}</button>
        </div>
      </div>`;
  }

  function startQuiz() {
    const cats = state.quizCats || [];
    const pool = shuffle(QUIZ.filter((q) => !cats.length || cats.includes(q.category)));
    const n = state.quizCount || 10;
    const items = (n ? pool.slice(0, n) : pool).map((q) => ({ ...q, order: shuffle(q.options.map((_, i) => i)) }));
    state.quiz = { items, i: 0, picked: null, score: 0, wrong: [] };
    render(true);
  }

  function renderQuizResult() {
    const qz = state.quiz;
    const pct = Math.round((qz.score / qz.items.length) * 100);
    const verdict = pct >= 85 ? 'Bardzo dobry wynik. Ten materiał masz opanowany.' : pct >= 60 ? 'Solidnie. Powtórz zagadnienia z listy poniżej.' : 'Warto wrócić do materiału i spróbować ponownie.';
    const wrongTopics = [...new Map(qz.wrong.map((w) => [w.topic, w])).values()];
    view.innerHTML = `
      <div class="view-head"><h1>Wynik quizu</h1></div>
      <div class="panel">
        <p class="score">${qz.score}/${qz.items.length} <small>${pct}%</small></p>
        <p>${verdict}</p>
        ${wrongTopics.length ? `<h2 class="sec" style="margin-top:24px">Do powtórki</h2>
          <p class="muted" style="margin:0 0 4px">Te zagadnienia są już na liście do powtórki na stronie startowej.</p>
          <ul class="mistakes">${wrongTopics.map((w) =>
          `<li><a href="#${w.topic}"><b>${esc(TOPIC[w.topic].title)}</b><span>${w.q}</span></a></li>`).join('')}</ul>` : ''}
        <div class="row-end"><button class="btn ghost" type="button" data-act="quiz-exit">Zmień ustawienia</button><button class="btn primary" type="button" data-act="quiz-start">${icon('undo')}Jeszcze raz</button></div>
      </div>`;
  }

  // ---------- Flashcards ----------
  function buildDeck() {
    const deck = shuffle(QA.filter((q) => levelOk(q.level) && (!state.cat || q.category === state.cat)));
    state.flash = { deck, flipped: false, known: 0, total: deck.length };
  }

  function renderFlash() {
    document.title = 'Fiszki · Baza wiedzy FE';
    if (!state.flash) buildDeck();
    const f = state.flash;
    const card = f.deck[0];
    const head = `
      <div class="view-head">
        <h1>${state.cat ? `Fiszki: ${esc(CAT[state.cat].name)}` : 'Fiszki'}</h1>
        <p class="lede">Przeczytaj pytanie, odpowiedz w myślach, odwróć kartę i oceń się. Karty oznaczone „Powtórz” wracają na koniec talii.</p>
      </div>`;
    if (!card) {
      view.innerHTML = `${head}<div class="panel"><p class="score">${f.known}/${f.total}</p><p>Talia przerobiona. Zacznij od nowa albo wybierz inną kategorię w panelu bocznym.</p>
        <div class="row-end"><span></span><button class="btn primary" type="button" data-act="flash-reset">${icon('shuffle')}Nowa talia</button></div></div>`;
      return;
    }
    view.innerHTML = `${head}
      <div class="flash-wrap">
        <div class="flash-meta"><span>Umiem: ${f.known} z ${f.total}</span><span>W talii: ${f.deck.length}</span></div>
        <div class="progress" role="progressbar" aria-label="Opanowane karty" aria-valuemin="0" aria-valuemax="${f.total}" aria-valuenow="${f.known}"><span style="width:${(f.known / (f.total || 1)) * 100}%"></span></div>
        <button class="flashcard" type="button" data-act="flip" aria-label="${f.flipped ? 'Odpowiedź. Kliknij, aby wrócić do pytania' : 'Pytanie. Kliknij, aby zobaczyć odpowiedź'}">
          <span class="side"><b>${f.flipped ? 'Odpowiedź' : 'Pytanie'}</b><span><span class="swatch" style="background:${hue(card.category)}"></span>${esc(CAT[card.category].short || CAT[card.category].name)}, ${card.level}</span></span>
          ${f.flipped ? `<span class="asked">${card.q}</span><span class="back prose">${card.a}</span>` : `<span class="front">${card.q}</span><span class="hint">Kliknij lub naciśnij <kbd>Spacja</kbd>, aby odwrócić</span>`}
        </button>
        <div class="flash-controls">
          <a class="btn ghost" href="#${card.topic}">${icon('book')}Otwórz zagadnienie</a>
          <span class="btns">
            <button class="btn" type="button" data-act="flash-again">${icon('undo')}Powtórz <kbd>←</kbd></button>
            <button class="btn primary" type="button" data-act="flash-known">${icon('check')}Umiem <kbd>→</kbd></button>
          </span>
        </div>
        <p style="margin-top:20px"><button class="btn ghost" type="button" data-act="flash-reset">${icon('shuffle')}Przetasuj od nowa</button></p>
      </div>`;
  }

  // ---------- Checklist ----------
  function clVisible() {
    const terms = norm(state.query).split(/\s+/).filter(Boolean);
    return CL_RULES.filter((r) => (!state.clCat || r.cat === state.clCat)
      && (!state.clPrio.length || state.clPrio.includes(r.priority))
      && (state.clStatus === 'all' || (state.clStatus === 'done') === state.clDone.has(r.key))
      && terms.every((t) => clIndex()[r.key].includes(t)));
  }

  function clProgressHTML() {
    const scope = CL_RULES.filter((r) => !state.clCat || r.cat === state.clCat);
    const done = scope.filter((r) => state.clDone.has(r.key)).length;
    const pct = scope.length ? Math.round((done / scope.length) * 100) : 0;
    const chips = Object.keys(PRIO).map((p) => {
      const inP = scope.filter((r) => r.priority === p);
      if (!inP.length) return '';
      const d = inP.filter((r) => state.clDone.has(r.key)).length;
      return `<button class="chip" type="button" data-act="cl-prio" data-p="${p}" aria-pressed="${state.clPrio.includes(p)}">${PRIO[p]} <span class="pill">${d}/${inP.length}</span></button>`;
    }).join('');
    return `<div class="cl-progress-head"><b>${done} z ${scope.length}</b> reguł zrobione <span class="muted">(${pct}%)</span></div>
      <div class="progress" role="progressbar" aria-label="Postęp checklisty" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
      <div class="field"><span>Filtruj po priorytecie</span><div class="chips">${chips}</div></div>`;
  }

  function clRuleHTML(r) {
    const done = state.clDone.has(r.key);
    const links = [{ title: 'Reguła w Front-End Checklist (EN)', url: r.url }, ...r.sources];
    return `<li class="cl-rule${done ? ' is-done' : ''}" data-key="${r.key}">
      <input type="checkbox" id="cb-${r.cat}-${r.id}" data-key="${r.key}" ${done ? 'checked' : ''} aria-label="Zrobione: ${esc(stripHtml(r.title).trim())}">
      <details>
        <summary><span class="cl-title">${state.query ? highlight(r.title, state.query) : r.title}</span><span class="prio prio-${r.priority}">${PRIO[r.priority]}</span></summary>
        <div class="cl-body prose">
          <p>${r.desc}</p>
          ${r.why.length ? `<h4>Dlaczego to ważne</h4><ul class="cl-why">${r.why.map((w) => `<li>${w}</li>`).join('')}</ul>` : ''}
          <h4>Jak sprawdzić</h4>
          <p>${r.verify}</p>
          ${r.code.map((b) => codeBlockHTML(b)).join('')}
          ${r.pitfalls.length ? `<div class="callout pitfalls"><h4>Częste błędy</h4><ul>${r.pitfalls.map((x) => `<li>${x}</li>`).join('')}</ul></div>` : ''}
          <h4>Źródła</h4>
          <ul class="cl-links">${links.map((l) => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a> <span class="host">${host(l.url)}</span></li>`).join('')}</ul>
        </div>
      </details>
    </li>`;
  }

  function codeBlockHTML(b, fallbackLang = 'none') {
    const lang = `<span class="code-lang">${LANG_LABEL[b.lang] || b.lang}</span>`;
    return `<figure class="code">
        <figcaption class="code-head"><span>${b.title ? `<b>${esc(b.title)}</b> ${lang}` : lang}</span>
          <button class="copy" type="button" data-act="copy">${icon('copy')}<span>Kopiuj</span></button></figcaption>
        <pre><code class="language-${LANG[b.lang] || fallbackLang}">${esc(b.src)}</code></pre>
      </figure>`;
  }

  function linksInline(list) {
    return list.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a>`).join(', ');
  }

  function renderChecklist() {
    const c = state.clCat ? CL_CAT[state.clCat] : null;
    document.title = `${c ? c.name + ' · ' : ''}Checklista · Baza wiedzy FE`;
    const visible = new Set(clVisible().map((r) => r.key));
    const cats = c ? [c] : CL;
    const sections = cats.map((cat) => {
      const groups = cat.groups.map((g) => {
        const rules = g.rules.map((r) => CL_RULES.find((x) => x.key === `${cat.id}/${r.id}`)).filter((r) => visible.has(r.key));
        if (!rules.length) return '';
        const all = g.rules.length, d = g.rules.filter((r) => state.clDone.has(`${cat.id}/${r.id}`)).length;
        return `<section class="cl-group">
          <h3>${esc(g.name)} <span class="pill">${d}/${all}</span></h3>
          ${g.sources.length ? `<p class="cl-src">Standardy: ${linksInline(g.sources)}</p>` : ''}
          <ul class="cl-list">${rules.map(clRuleHTML).join('')}</ul>
        </section>`;
      }).join('');
      if (!groups) return '';
      return `<section class="cl-cat">
        ${c ? '' : `<h2 class="cl-cat-title"><span class="swatch" style="background:var(--hue-${CL_HUE[cat.id] || 'system'})"></span><a href="#cl-${cat.id}">${esc(cat.name)}</a></h2>`}
        ${groups}</section>`;
    }).join('');
    view.innerHTML = `
      ${c ? `<nav class="crumbs" aria-label="Ścieżka"><a href="#checklista">Checklista</a><span aria-hidden="true">/</span><span>${esc(c.name)}</span></nav>` : ''}
      <div class="view-head">
        <h1>${c ? esc(c.name) : 'Checklista front-end'}</h1>
        <p class="lede">${c ? esc(c.desc) : `${CL_RULES.length} reguł dla nowoczesnych stron i aplikacji: dostępność, wydajność, bezpieczeństwo, prywatność, SEO, HTML, CSS, JavaScript, obrazy, testy i i18n. Postęp zapisuje się w tej przeglądarce.`}</p>
        ${c && c.sources.length ? `<p class="cl-src" style="margin-top:10px">Standardy: ${linksInline(c.sources)}</p>` : ''}
      </div>
      <div class="panel cl-panel" id="cl-progress">${clProgressHTML()}</div>
      <div class="cl-toolbar">
        <div class="seg" role="group" aria-label="Status">
          ${[['all', 'Wszystkie'], ['todo', 'Do zrobienia'], ['done', 'Zrobione']].map(([k, l]) => `<button type="button" data-act="cl-status" data-s="${k}" aria-pressed="${state.clStatus === k}">${l}</button>`).join('')}
        </div>
        <button class="btn" type="button" data-act="cl-launch">Przed startem: krytyczne i wysokie</button>
        <button class="btn ghost" type="button" data-act="expand">Rozwiń wszystkie</button>
        <button class="btn ghost" type="button" data-act="collapse">Zwiń wszystkie</button>
        ${state.clConfirmReset
          ? `<span class="cl-confirm" role="alert">Wyczyścić postęp ${c ? 'tej kategorii' : 'całej checklisty'}? <button class="btn danger" type="button" data-act="cl-reset-yes">Tak, wyczyść</button><button class="btn" type="button" data-act="cl-reset-no">Anuluj</button></span>`
          : `<button class="btn ghost" type="button" data-act="cl-reset">Wyczyść postęp</button>`}
      </div>
      ${state.query ? `<p class="muted">Filtr wyszukiwania „${esc(state.query)}”: ${visible.size} ${plural(visible.size, 'reguła', 'reguły', 'reguł')}</p>` : ''}
      ${sections || '<div class="empty"><b>Brak reguł dla wybranych filtrów</b>Zmień status, priorytet lub wyczyść wyszukiwanie.</div>'}
      <p class="cl-attrib">Reguły opracowane na podstawie <a href="https://frontendchecklist.io/" target="_blank" rel="noopener noreferrer">Front-End Checklist</a> (David Dias, licencja MIT, <a href="https://github.com/thedaviddias/Front-End-Checklist" target="_blank" rel="noopener noreferrer">GitHub</a>), przetłumaczone i uzupełnione o źródła standardów. Każda reguła linkuje do oryginału z przykładami kodu.</p>`;
  }

  view.addEventListener('toggle', (e) => {
    if (e.target.matches?.('.cl-rule details') && e.target.open) highlightIn(e.target);
  }, true);

  view.addEventListener('change', (e) => {
    const cb = e.target.closest('.cl-rule input[type="checkbox"]');
    if (!cb) return;
    const key = cb.dataset.key;
    if (cb.checked) state.clDone.add(key); else state.clDone.delete(key);
    saveCl();
    cb.closest('.cl-rule').classList.toggle('is-done', cb.checked);
    $('#cl-progress').innerHTML = clProgressHTML();
    renderClRail();
    const rule = CL_RULES.find((r) => r.key === key);
    const pill = cb.closest('.cl-group')?.querySelector('h3 .pill');
    if (rule && pill) {
      const inGroup = CL_RULES.filter((r) => r.cat === rule.cat && r.group === rule.group);
      pill.textContent = `${inGroup.filter((r) => state.clDone.has(r.key)).length}/${inGroup.length}`;
    }
  });

  // ---------- Actions ----------
  view.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'random') {
      const pool = TOPICS.filter((t) => levelOk(t.level));
      const unread = pool.filter((t) => !state.seen.has(t.id));
      const from = unread.length ? unread : pool; // prefer something not read yet
      go(from[Math.floor(Math.random() * from.length)].id);
    } else if (act === 'copy') {
      const code = el.closest('.code').querySelector('code');
      const label = el.querySelector('span');
      const done = () => { label.textContent = 'Skopiowano'; setTimeout(() => (label.textContent = 'Kopiuj'), 1500); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); label.textContent = 'Zaznaczono'; };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(code.textContent).then(done, fallback);
      else fallback();
    } else if (act === 'toc') {
      document.getElementById(el.dataset.target)?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    } else if (act === 'mark') {
      const t = TOPIC[location.hash.slice(1)];
      if (!t) return;
      const v = el.dataset.v;
      if (state.mastery[t.id] === v) delete state.mastery[t.id];
      else state.mastery[t.id] = v;
      saveProgress();
      renderSelfCheck(t);
      $('#sec-ocena [data-act="mark"][data-v="' + v + '"]')?.focus();
    } else if (act === 'expand' || act === 'collapse') {
      view.querySelectorAll('details').forEach((d) => (d.open = act === 'expand'));
    } else if (act === 'quiz-cat') {
      state.quizCats = [el.dataset.cat]; state.quiz = null; go('quiz');
    } else if (act === 'flash-cat') {
      state.cat = el.dataset.cat; state.flash = null; go('fiszki');
    } else if (act === 'qcat') {
      const id = el.dataset.cat;
      let cats = state.quizCats || [];
      cats = !id ? [] : cats.includes(id) ? cats.filter((c) => c !== id) : [...cats, id];
      state.quizCats = cats; render();
    } else if (act === 'qcount') {
      state.quizCount = Number(el.dataset.n); render();
    } else if (act === 'quiz-start') {
      startQuiz();
    } else if (act === 'pick') {
      pick(Number(el.dataset.opt));
    } else if (act === 'quiz-next') {
      state.quiz.i++; state.quiz.picked = null; render(true); window.scrollTo({ top: 0, behavior: 'instant' });
    } else if (act === 'quiz-exit') {
      state.quiz = null; render(true);
    } else if (act === 'flip') {
      state.flash.flipped = !state.flash.flipped; render(); $('.flashcard')?.focus();
    } else if (act === 'flash-known' || act === 'flash-again') {
      flashNext(act === 'flash-known');
    } else if (act === 'cl-prio') {
      const p = el.dataset.p;
      state.clPrio = state.clPrio.includes(p) ? state.clPrio.filter((x) => x !== p) : [...state.clPrio, p];
      saveCl(); render();
    } else if (act === 'cl-status') {
      state.clStatus = el.dataset.s; render();
    } else if (act === 'cl-launch') {
      state.clPrio = ['critical', 'high']; state.clStatus = 'todo'; saveCl(); render();
    } else if (act === 'cl-reset') {
      state.clConfirmReset = true; render();
    } else if (act === 'cl-reset-no') {
      state.clConfirmReset = false; render();
    } else if (act === 'cl-reset-yes') {
      CL_RULES.forEach((r) => { if (!state.clCat || r.cat === state.clCat) state.clDone.delete(r.key); });
      state.clConfirmReset = false; saveCl(); render();
    } else if (act === 'flash-reset') {
      state.flash = null; render(true);
    }
  });

  function pick(opt) {
    const qz = state.quiz;
    if (!qz || qz.picked != null) return;
    const item = qz.items[qz.i];
    qz.picked = opt;
    if (opt === item.answer) qz.score++;
    else {
      qz.wrong.push(item);
      state.mastery[item.topic] = 'review'; // a wrong answer sends the topic back to review
      saveProgress();
    }
    render();
  }

  function flashNext(known) {
    const f = state.flash;
    const card = f.deck.shift();
    if (known) f.known++;
    else f.deck.push(card);
    f.flipped = false;
    render();
    $('.flashcard')?.focus();
  }

  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    if (e.key === '/' && !typing) { e.preventDefault(); qInput.focus(); return; }
    if (e.key === 'Escape' && document.activeElement === qInput) { clearQuery(); qInput.blur(); render(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.mode === 'quiz' && state.quiz && state.quiz.i < state.quiz.items.length) {
      const item = state.quiz.items[state.quiz.i];
      const n = Number(e.key);
      if (state.quiz.picked == null && n >= 1 && n <= item.order.length) { pick(item.order[n - 1]); }
    }
    if (state.mode === 'fiszki' && state.flash && state.flash.deck.length) {
      if (e.key === ' ' && document.activeElement?.dataset.act !== 'flip' && document.activeElement?.tagName === 'BUTTON') return;
      if (e.key === ' ' && document.activeElement?.dataset.act !== 'flip') { e.preventDefault(); state.flash.flipped = !state.flash.flipped; render(); }
      else if (e.key === 'ArrowRight') flashNext(true);
      else if (e.key === 'ArrowLeft') flashNext(false);
    }
  });

  // Post-render enhancements: responsive tables, syntax highlighting, external links
  function enhance(root) {
    root.querySelectorAll('.prose table').forEach((t) => {
      if (t.parentElement.classList.contains('table-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.replaceWith(wrap);
      wrap.append(t);
    });
    root.querySelectorAll('.prose a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
    highlightIn(root, (el) => !el.closest('.cl-rule')); // checklist code is highlighted when a rule is opened
  }

  function highlightIn(root, filter = () => true) {
    if (!window.Prism?.highlightElement) return;
    root.querySelectorAll('pre code:not([data-hl])').forEach((el) => {
      if (!filter(el)) return;
      el.dataset.hl = '1';
      try { window.Prism.highlightElement(el); } catch { /* highlighting is optional */ }
    });
  }

  route();
})();
</script>
