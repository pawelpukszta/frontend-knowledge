order: 1
name: Dostępność
desc: WCAG 2.2, ARIA, klawiatura, formularze, multimedia i warstwa wizualna. Większość reguł odpowiada kryteriom sukcesu WCAG lub regułom silnika axe-core.
hue: rendering
sources:
  - title: "W3C: WCAG 2.2 Quick Reference"
    url: https://www.w3.org/WAI/WCAG22/quickref/
  - title: "W3C: WAI-ARIA Authoring Practices Guide"
    url: https://www.w3.org/WAI/ARIA/apg/
  - title: "Deque: axe-core rule descriptions"
    url: https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md
groups:
  - name: Animacje i ruch
    sources:
      - title: "W3C Understanding 2.3.1: Three Flashes or Below Threshold"
        url: https://www.w3.org/WAI/WCAG22/Understanding/three-flashes-or-below-threshold.html
      - title: "MDN: prefers-reduced-motion"
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion
    rules:
      - flashing-content
      - reduced-motion
      - parallax-effects
      - scrolljacking
      - anchor-smooth-scroll
  - name: ARIA
    sources:
      - title: "MDN: ARIA"
        url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA
      - title: "W3C: Using ARIA"
        url: https://www.w3.org/TR/using-aria/
      - title: "W3C: WAI-ARIA 1.2"
        url: https://www.w3.org/TR/wai-aria-1.2/
    rules:
      - aria-hidden-body
      - aria-input-field-name
      - aria-labels
      - aria-live-regions
      - aria-required-children
      - aria-valid-attr
      - duplicate-id-aria
      - aria-allowed-attr
      - aria-command-name
      - aria-deprecated-role
      - aria-dialog-name
      - aria-hidden-focus
      - aria-meter-name
      - aria-progressbar-name
      - aria-required-attr
      - aria-required-parent
      - aria-roles
      - aria-text
      - aria-toggle-field-name
      - aria-tooltip-name
      - aria-treeitem-name
      - aria-valid-attr-value
      - decorative-elements
  - name: Komponenty
    sources:
      - title: "W3C APG: Patterns"
        url: https://www.w3.org/WAI/ARIA/apg/patterns/
    rules:
      - modal-accessibility
      - accessible-notifications
      - accessible-tooltips
      - accordion-accessibility
      - carousel-accessibility
      - tabs-accessibility
  - name: Treść
    sources:
      - title: "W3C Understanding 2.4.4: Link Purpose (In Context)"
        url: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
    rules:
      - link-text
      - sensory-instructions
      - empty-links
      - inclusive-language
      - plain-language
  - name: Struktura dokumentu
    sources:
      - title: "W3C Understanding 1.3.1: Info and Relationships"
        url: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
      - title: "W3C WAI: Page Structure Tutorial"
        url: https://www.w3.org/WAI/tutorials/page-structure/
    rules:
      - heading-hierarchy
      - content-without-css
      - duplicate-id-active
      - navigation-landmark
      - accessible-tables
      - definition-list
      - dlitem
      - empty-heading
      - heading-order
      - list-structure
      - listitem
      - semantic-lists
      - table-duplicate-name
      - table-headers
      - td-headers-attr
      - th-has-data-cells
  - name: Formularze
    sources:
      - title: "W3C WAI: Forms Tutorial"
        url: https://www.w3.org/WAI/tutorials/forms/
      - title: "W3C Understanding 3.3.2: Labels or Instructions"
        url: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html
    rules:
      - form-labels
      - input-image-alt
      - accessible-authentication
      - redundant-entry
      - form-field-multiple-labels
      - label-content-name-mismatch
      - paste-inputs
      - select-name
  - name: Interakcja
    sources:
      - title: "W3C Understanding 2.2.1: Timing Adjustable"
        url: https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html
    rules:
      - button-name
      - session-timeout-recovery
      - draggable-accessibility
  - name: Klawiatura i focus
    sources:
      - title: "W3C Understanding 2.1.1: Keyboard"
        url: https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
      - title: "MDN: Keyboard-navigable JavaScript widgets"
        url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/Guides/Keyboard-navigable_JavaScript_widgets
    rules:
      - keyboard-navigation
      - focus-management
      - focus-not-obscured
      - focus-order
      - skip-navigation
      - skip-link
      - autofocus-avoidance
  - name: Multimedia
    sources:
      - title: "W3C WAI: Making Audio and Video Media Accessible"
        url: https://www.w3.org/WAI/media/av/
    rules:
      - autoplay-media
      - video-captions
      - audio-descriptions
  - name: Nawigacja i czytniki ekranu
    sources:
      - title: "W3C Understanding 3.2.6: Consistent Help"
        url: https://www.w3.org/WAI/WCAG22/Understanding/consistent-help.html
      - title: "WebAIM: Screen Reader User Survey"
        url: https://webaim.org/projects/screenreadersurvey10/
    rules:
      - consistent-help
      - screen-reader-testing
  - name: Warstwa wizualna i strona
    sources:
      - title: "W3C Understanding 1.4.3: Contrast (Minimum)"
        url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
      - title: "W3C Understanding 1.4.10: Reflow"
        url: https://www.w3.org/WAI/WCAG22/Understanding/reflow.html
    rules:
      - zoom-reflow
      - color-contrast
      - orientation
      - text-resizing
      - accesskeys
      - frame-title
      - html-xml-lang-mismatch
      - identical-links-same-purpose
      - landmark-one-main
      - landmark-regions
      - link-in-text-block
      - meta-refresh
      - object-alt
      - tabindex
      - touch-targets
      - image-redundant-alt
      - text-in-images
